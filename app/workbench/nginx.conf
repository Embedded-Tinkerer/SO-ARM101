# nginx site for the workbench. Replace arm.example.com, the certificate paths,
# and UNRAID_IP. The Upgrade/Connection headers are required for the terminal.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name arm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name arm.example.com;

    ssl_certificate     /etc/letsencrypt/live/arm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arm.example.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://UNRAID_IP:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1d;   # keep idle terminals open
        proxy_send_timeout 1d;
    }
}
